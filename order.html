<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অর্ডার কনফার্ম করুন - সুগন্ধি বিলাস</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.85), rgba(30, 27, 75, 0.9)), 
                        url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat fixed;
            color: #fff;
        }

        .order-container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .badge {
            position: absolute;
            top: 20px;
            right: -30px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: #fff;
            padding: 6px 35px;
            transform: rotate(45deg);
            font-size: 13px;
            font-weight: 700;
        }

        h2 { 
            text-align: center; 
            font-size: 28px;
            background: linear-gradient(to right, #fbbf24, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px; 
        }

        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; color: #f8fafc; font-weight: 500; }
        
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            outline: none;
            font-size: 15px;
        }

        input:readonly { 
            background: rgba(255, 255, 255, 0.15); 
            color: #fbbf24; 
            font-weight: bold; 
            border-color: rgba(251, 191, 36, 0.4);
        }

        select option { background: #1e1b4b; color: #fff; }

        .submit-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, #f43f5e, #e11d48, #9333ea);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 10px 20px rgba(244, 63, 94, 0.4);
            transition: transform 0.2s ease;
        }

        .submit-btn:hover { transform: translateY(-2px); }

        .security { text-align: center; margin-top: 15px; font-size: 13px; color: #94a3b8; }
        .security i { color: #22c55e; }
    </style>
</head>
<body>

    <div class="order-container">
        <div class="badge">স্পেশাল অফার</div>
        <h2>অর্ডার কনফার্ম করুন</h2>
        
        <form id="orderForm">
            <div class="form-group">
                <label><i class="fa-solid fa-bottle-droplet"></i> নির্বাচিত আতর:</label>
                <input type="text" id="productName" readonly value="কোনো পণ্য নির্বাচিত হয়নি">
            </div>
            
            <div class="form-group">
                <label><i class="fa-solid fa-tag"></i> মূল্য:</label>
                <input type="text" id="productPrice" readonly value="৳০">
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> আপনার নাম:</label>
                <input type="text" placeholder="পুরো নাম লিখুন" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-phone"></i> মোবাইল নম্বর:</label>
                <input type="tel" placeholder="০1XXXXXXXXX" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-location-dot"></i> পূর্ণাঙ্গ ঠিকানা:</label>
                <textarea rows="2" placeholder="বাসা/রোড নম্বর, এলাকা ও জেলা" required></textarea>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-truck"></i> ডেলিভারি এলাকা:</label>
                <select>
                    <option value="inside">ঢাকার ভেতরে (৳৬০)</option>
                    <option value="outside">ঢাকার বাইরে (৳১২০)</option>
                </select>
            </div>

            <button type="submit" class="submit-btn"><i class="fa-solid fa-bolt"></i> দ্রুত অর্ডার করুন</button>
            
            <div class="security">
                <i class="fa-solid fa-shield-halved"></i> আপনার তথ্য সম্পূর্ণ নিরাপদ ও সুরক্ষিত
            </div>
        </form>
    </div>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const itemName = urlParams.get('item');
            const itemPrice = urlParams.get('price');

            if(itemName) {
                document.getElementById('productName').value = itemName;
            }
            if(itemPrice) {
                document.getElementById('productPrice').value = '৳' + itemPrice;
            }
        };
    </script>

</body>
                           </html>
