<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অর্ডার করুন | Maruf's Aroma</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0a0a0c;
            color: #fff;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(10, 10, 12, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            margin-bottom: 40px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #d4af37;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            text-decoration: none;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            margin-left: 25px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #d4af37;
        }

        .header-title {
            text-align: center;
            color: #d4af37;
            font-size: 32px;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .order-container {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 8%;
        }

        /* Order Form */
        .order-form {
            background: #16151c;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            flex: 1;
            min-width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #d4af37;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            background: #0a0a0c;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: #d4af37;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        }

        /* Summary Box */
        .order-summary {
            background: #16151c;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            width: 350px;
            max-width: 100%;
            height: fit-content;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #b8860b, #ffd700);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-submit:hover {
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.8);
            transform: translateY(-2px);
        }

        /* --- Live Inbox Feature --- */
        .inbox-button {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: linear-gradient(45deg, #b8860b, #ffd700);
            color: #000;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            z-index: 1000;
            font-size: 24px;
            transition: transform 0.3s;
        }

        .inbox-button:hover {
            transform: scale(1.1);
        }

        .inbox-modal {
            position: fixed;
            bottom: 95px;
            right: 25px;
            width: 320px;
            background: #16151c;
            border: 1px solid #d4af37;
            border-radius: 12px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 1000;
        }

        .inbox-header {
            background: #0a0a0c;
            padding: 15px;
            color: #d4af37;
            font-weight: bold;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .inbox-body {
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message-received {
            background: #222;
            color: #ccc;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            align-self: flex-start;
        }

        .inbox-footer {
            padding: 10px;
            display: flex;
            gap: 5px;
            background: #0a0a0c;
        }

        .inbox-footer input {
            flex: 1;
            padding: 8px;
            background: #16151c;
            border: 1px solid #333;
            color: #fff;
            border-radius: 5px;
            outline: none;
        }

        .inbox-footer button {
            background: #d4af37;
            border: none;
            padding: 8px 12px;
            color: #000;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- নেভিগেশন বার -->
    <nav>
        <a href="index.html" class="logo">MARUF'S AROMA</a>
        <div class="nav-links">
            <a href="index.html">হোম</a>
            <a href="order.html" style="color: #d4af37;">অর্ডার করুন</a>
        </div>
    </nav>

    <h1 class="header-title">আপনার অর্ডারটি নিশ্চিত করুন</h1>

    <div class="order-container">
        <!-- ফর্ম সেকশন -->
        <div class="order-form">
            <h2 style="color: #fff; margin-bottom: 20px;">গ্রাহকের তথ্য</h2>
            <form id="checkoutForm">
                <div class="form-group">
                    <label>আপনার পূর্ণ নাম *</label>
                    <input type="text" placeholder="মোঃ রফিকুল ইসলাম" required>
                </div>
                <div class="form-group">
                    <label>মোবাইল নম্বর *</label>
                    <input type="tel" placeholder="017XXXXXXXX" required>
                </div>
                <div class="form-group">
                    <label>সম্পূর্ণ ঠিকানা *</label>
                    <textarea rows="3" placeholder="বাসা/রোড নম্বর, এলাকা, থানা, জেলা" required></textarea>
                </div>
                <div class="form-group">
                    <label>পেমেন্ট পদ্ধতি সিলেক্ট করুন</label>
                    <select>
                        <option>ক্যাশ অন ডেলিভারি (Cash on Delivery)</option>
                        <option>বিকাশ / নগদ (Bkash/Nagad)</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">অর্ডার কনফার্ম করুন</button>
            </form>
        </div>

        <!-- অর্ডার সামারি -->
        <div class="order-summary">
            <h3 style="color: #d4af37; margin-bottom: 20px;">অর্ডার সামারি</h3>
            <div class="summary-item">
                <span>Maruf's Aroma Gold Edition</span>
                <span>৳ ৫০০</span>
            </div>
            <div class="summary-item">
                <span>ডেলিভারি চার্জ</span>
                <span>৳ ৮০</span>
            </div>
            <div class="summary-item" style="font-weight: bold; color: #d4af37; border: none;">
                <span>সর্বমোট</span>
                <span>৳ ৫৮০</span>
            </div>
        </div>
    </div>

    <!-- ইনবক্স আইকন ও চ্যাট পপআপ -->
    <div class="inbox-button" onclick="toggleInbox()">💬</div>

    <div class="inbox-modal" id="inboxModal">
        <div class="inbox-header">
            <span>Maruf's Aroma Support</span>
            <span style="cursor:pointer;" onclick="toggleInbox()">✕</span>
        </div>
        <div class="inbox-body" id="inboxBody">
            <div class="message-received">হ্যালো! Maruf's Aroma-তে আপনাকে স্বাগতম। কীভাবে সাহায্য করতে পারি?</div>
        </div>
        <div class="inbox-footer">
            <input type="text" id="chatInput" placeholder="মেসেজ লিখুন...">
            <button onclick="sendMessage()">পাঠান</button>
        </div>
    </div>

    <script>
        function toggleInbox() {
            var modal = document.getElementById('inboxModal');
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'flex';
            }
        }

        function sendMessage() {
            var input = document.getElementById('chatInput');
            var message = input.value.trim();
            if(message !== "") {
                var body = document.getElementById('inboxBody');
                var userMsg = document.createElement('div');
                userMsg.style.background = '#d4af37';
                userMsg.style.color = '#000';
                userMsg.style.padding = '8px 12px';
                userMsg.style.borderRadius = '8px';
                userMsg.style.fontSize = '13px';
                userMsg.style.alignSelf = 'flex-end';
                userMsg.innerText = message;
                body.appendChild(userMsg);
                input.value = '';
                body.scrollTop = body.scrollHeight;
            }
        }
    </script>

</body>
</html>
