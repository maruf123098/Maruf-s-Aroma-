<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maruf's Aroma | Royal Perfume Collection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background: #0a0a0c;
            color: #fff;
            overflow-x: hidden;
        }

        /* Header Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(10, 10, 12, 0.9);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #d4af37;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            text-decoration: none;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            margin-left: 25px;
            transition: 0.3s;
            font-size: 15px;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #d4af37;
        }

        /* Hero Section (3D Look) */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 120px 8% 50px;
            background: radial-gradient(circle at center, #1a1508 0%, #0a0a0c 70%);
            position: relative;
            flex-wrap: wrap;
        }

        .hero-text {
            max-width: 550px;
        }

        .hero-text h1 {
            font-size: 48px;
            color: #d4af37;
            margin-bottom: 20px;
            line-height: 1.2;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        .hero-text p {
            color: #ccc;
            font-size: 16px;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        .btn-gold {
            padding: 15px 35px;
            background: linear-gradient(45deg, #b8860b, #ffd700);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
        }

        .btn-gold:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.8);
        }

        /* 3D Visual Box */
        .product-3d-box {
            position: relative;
            width: 450px;
            max-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        .product-img {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.3);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(1deg); }
        }

        /* Glowing Background Effect */
        .glow-effect {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(212,175,55,0.15) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- নেভিগেশন বার -->
    <nav>
        <a href="index.html" class="logo">MARUF'S AROMA</a>
        <div class="nav-links">
            <a href="index.html" class="active">হোম</a>
            <a href="order.html">অর্ডার করুন</a>
        </div>
    </nav>

    <!-- ১ম পেজ: ৩ডি প্রোডাক্ট হোম পেজ -->
    <section class="hero">
        <div class="glow-effect"></div>
        <div class="hero-text">
            <h1>রাজকীয় সুবাসের আভিজাত্য</h1>
            <p>অনুভব করুন ৩ডি দুর্গের মতো তৈরি খাঁটি গোল্ডেন অ্যারোমার রাজকীয় অভিজ্ঞতা। আপনার ব্যক্তিত্বকে করে তুলুন আরও আভিজাত্যময় ও আকর্ষণীয়।</p>
            <a href="order.html" class="btn-gold">এখনই অর্ডার করুন</a>
        </div>
        <div class="product-3d-box">
            <!-- আপনার ইমেজের নাম বা ফাইল লিংক এখানে দিন -->
            <img src="perfume.png">
        </div>
    </section>

</body>
</html>
