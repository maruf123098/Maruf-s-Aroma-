<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সুগন্ধি বিলাস - প্রিমিয়াম আতর শপ</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
        
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 27, 75, 0.95)), 
                        url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat fixed;
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        .hero-section {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 50px 30px;
            border-radius: 30px;
            max-width: 600px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
            background: linear-gradient(to right, #fbbf24, #f43f5e, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 18px;
            color: #cbd5e1;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .cta-button {
            display: inline-block;
            padding: 16px 36px;
            background: linear-gradient(45deg, #f43f5e, #9333ea);
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 20px;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(244, 63, 94, 0.4);
        }

        .cta-button:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(244, 63, 94, 0.6);
        }
    </style>
</head>
<body>

    <div class="hero-section">
        <h1>সুগন্ধি বিলাস</h1>
        <p>আপনার বিশেষ মুহূর্তগুলোকে আরও স্মরণীয় করতে আমরা নিয়ে এসেছি সেরা মানের প্রিমিয়াম আতর। আপনার পছন্দের সুগন্ধি বেছে নিতে এখনই আমাদের শপে প্রবেশ করুন।</p>
        
        <a href="shop.html" class="cta-button">শপে প্রবেশ করুন</a>
    </div>

</body>
</html>
