<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maruf's Aroma - Sugandhi Bilas</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #333;
        }
        header {
            background-color: #1a1a1a;
            color: #d4af37;
            text-align: center;
            padding: 20px;
        }
        header h1 {
            margin: 0;
            font-size: 28px;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 15px;
        }
        .product-card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            margin-bottom: 25px;
        }
        .product-image {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .product-card h2 {
            color: #1a1a1a;
            margin-top: 10px;
        }
        .price {
            font-size: 20px;
            color: #d4af37;
            font-weight: bold;
        }
        .order-section {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .order-section h3 {
            text-align: center;
            color: #1a1a1a;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-whatsapp:hover {
            background-color: #1eb954;
        }
    </style>
</head>
<body>

    <header>
        <h1>Maruf's Aroma</h1>
        <p>sugandhi bilas</p>
    </header>

    <div class="container">
        <!-- Product Section -->
        <div class="product-card">
            <!-- আপনি চাইলে এখানে নিচের লিংকটি পরিবর্তন করে নিজের ছবির লিংক বসাতে পারেন -->
            <img src="https://image_gen.com/a/perfume_gold_luxury.jpg" alt="Maruf's Aroma Premium Perfume" class="product-image">
            <h2>প্রিমিয়াম সুবাস তেল / পারফিউম</h2>
            <p>আভিজাত্য ও দীর্ঘস্থায়ী সুবাসের অনন্য মিশ্রণ।</p>
            <p class="price">মূল্য: ৳ ৫০০ (ক্যাশ অন ডেলিভারি)</p>
        </div>

        <!-- Order Form Section -->
        <div class="order-section">
            <h3>সহজে অর্ডার করুন</h3>
            <form id="orderForm">
                <label>আপনার নাম:</label>
                <input type="text" id="name" placeholder="আপনার পূর্ণ নাম লিখুন" required>

                <label>মোবাইল নম্বর:</label>
                <input type="tel" id="phone" placeholder="01XXXXXXXXX" required>

                <label>পূর্ণ ঠিকানা (ডেলিভারির জন্য):</label>
                <textarea id="address" rows="3" placeholder="বাসা/রোড নম্বর, এলাকা, জেলা" required></textarea>

                <label>প্রোডাক্টের পরিমাণ:</label>
                <select id="quantity">
                    <option value="1">১ টি - ৳৫০০</option>
                    <option value="2">২ টি - ৳১০০০</option>
                    <option value="3">৩ টি - ৳১৫০০</option>
                </select>

                <button type="button" class="btn-whatsapp" onclick="sendToWhatsApp()">WhatsApp-এ সরাসরি অর্ডার করুন</button>
            </form>
        </div>
    </div>

    <script>
        function sendToWhatsApp() {
            // আপনার হোয়াটসঅ্যাপ নম্বরটি এখানে লিখুন (দেশিসহ code: 880)
            var phoneNumber = "8801737268789"; // <--- এখানে আপনার WhatsApp নম্বর দিন

            var name = document.getElementById("name").value;
            var phone = document.getElementById("phone").value;
            var address = document.getElementById("address").value;
            var quantity = document.getElementById("quantity").value;

            if(name == "" || phone == "" || address == ""){
                alert("দয়া করে নাম, মোবাইল নম্বর এবং ঠিকানা পূরণ করুন।");
                return;
            }

            var message = "*নতুন অর্ডার - Maruf's Aroma*%0A%0A" +
                "*নাম:* " + name + "%0A" +
                "*ফোন:* " + phone + "%0A" +
                "*ঠিকানা:* " + address + "%0A" +
                "*পরিমাণ:* " + quantity + " টি%0A%0A" +
                "আমি এই অর্ডারটি নিশ্চিত করতে চাই।";

            var whatsappURL = "https://wa.me/" + phoneNumber + "?text=" + message;
            window.open(whatsappURL, '_blank');
        }
    </script>

</body>
                        </html>
